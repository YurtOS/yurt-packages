name: Deploy rustup dist pages

# Triggered by the PACKAGE_PUBLISH_TOKEN (PAT) push of the manifests to main made
# by publish-rustup-dist.yml. A push made with the default GITHUB_TOKEN would not
# trigger this workflow, which is why that workflow commits with the PAT.
# Pages must be enabled with source "GitHub Actions" (see README) before this can deploy.
on:
  push:
    branches: [main]
    paths: ["dist/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Stage rustup dist
        run: |
          mkdir _site
          printf '%s\n' '<!doctype html><title>Yurt rustup dist</title><h1>Yurt rustup dist</h1>' > _site/index.html
          [[ ! -d dist ]] || cp -R dist _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
