name: Publish Rustup Dist

on:
  workflow_dispatch:
    inputs:
      rust_release:
        description: "yurt-rust release tag to publish (rust-vX.Y.Z-A.B.C)"
        required: true
        type: string
      tooling_ref:
        description: "yurt-rust ref holding the emitter and checker (independent of the release tag)"
        required: false
        default: main
        type: string
      date:
        description: "Dist date YYYY-MM-DD (empty: today, UTC)"
        required: false
        default: ""
        type: string
      producer_host:
        description: "Host whose archive supplies the guest std"
        required: false
        default: x86_64-unknown-linux-gnu
        type: choice
        options:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin

# Five jobs on fresh VMs: plan -> emit -> publish -> check -> push. Code from tooling_ref (the
# emitter and the URL checker) runs only in emit and check, which hold only the read-only
# YURT_RUST_READ_TOKEN. publish (job-scoped GITHUB_TOKEN, contents: write) and push
# (RUSTUP_DIST_PUBLISH_TOKEN from the rustup-publish environment) run only the scripts in
# trusted/ (this repository at github.sha) and treat the artifacts as data. Identity values come
# only from plan; artifact ids come from emit (untrusted: checked all digits, current run only);
# digests come from publish. Every needs/inputs value reaches a script through env:, never run:.
# See the README for the tokens, the environment and the rerun policy.
permissions: {}

# Shares the group of publish-package.yml: both push to main and must not race. publish's
# deletion of a release left by a failed run is safe only because this group serializes runs.
concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # the trusted/ checkout; plan runs only trusted code
    outputs:
      release_tag: ${{ steps.plan.outputs.release_tag }}
      version: ${{ steps.plan.outputs.version }}
      revision: ${{ steps.plan.outputs.revision }}
      date: ${{ steps.plan.outputs.date }}
      producer_host: ${{ steps.plan.outputs.producer_host }}
      tooling_sha: ${{ steps.plan.outputs.tooling_sha }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Check out the trusted scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Validate the inputs and resolve the tooling SHA
        id: plan
        env:
          GH_TOKEN: ${{ secrets.YURT_RUST_READ_TOKEN }}
          RUST_RELEASE: ${{ inputs.rust_release }}
          PUBLISH_DATE: ${{ inputs.date }}
          PRODUCER_HOST: ${{ inputs.producer_host }}
          TOOLING_REF: ${{ inputs.tooling_ref }}
        run: OUTPUT_FILE="$GITHUB_OUTPUT" "$GITHUB_WORKSPACE/trusted/tools/publish_rustup_dist.sh" plan

  emit:
    needs: [plan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PLAN_RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      PLAN_VERSION: ${{ needs.plan.outputs.version }}
      PLAN_REVISION: ${{ needs.plan.outputs.revision }}
      PLAN_DATE: ${{ needs.plan.outputs.date }}
      PLAN_PRODUCER_HOST: ${{ needs.plan.outputs.producer_host }}
      PLAN_TOOLING_SHA: ${{ needs.plan.outputs.tooling_sha }}
      PLAN_TAG: ${{ needs.plan.outputs.tag }}
    outputs:
      dist_artifact_id: ${{ steps.upload-dist.outputs.artifact-id }}
      components_artifact_id: ${{ steps.upload-components.outputs.artifact-id }}
    steps:
      - name: Check out the trusted scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out yurt-packages (Pages branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: site
          persist-credentials: false

      - name: Check out yurt-rust tooling at the planned SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: YurtOS/yurt-rust
          ref: ${{ needs.plan.outputs.tooling_sha }}
          path: tooling
          token: ${{ secrets.YURT_RUST_READ_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install ripgrep (needed by the emitter)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Emit the dist and the components
        env:
          GH_TOKEN: ${{ secrets.YURT_RUST_READ_TOKEN }}
          YURT_RUST_TOOLING_DIR: ${{ github.workspace }}/tooling
          YURT_SITE_DIR: ${{ github.workspace }}/site
          OUT_DIR: ${{ runner.temp }}/rustup-out
          WORK_DIR: ${{ runner.temp }}/rustup-work
        run: |
          "$GITHUB_WORKSPACE/trusted/tools/publish_rustup_dist.sh" emit

      - name: Upload the dist
        id: upload-dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustup-dist
          path: ${{ runner.temp }}/rustup-out/dist/dist.tar
          if-no-files-found: error
          retention-days: 1

      - name: Upload the components
        id: upload-components
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustup-components
          path: ${{ runner.temp }}/rustup-out/components/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    needs: [plan, emit]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      PLAN_RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      PLAN_VERSION: ${{ needs.plan.outputs.version }}
      PLAN_REVISION: ${{ needs.plan.outputs.revision }}
      PLAN_DATE: ${{ needs.plan.outputs.date }}
      PLAN_PRODUCER_HOST: ${{ needs.plan.outputs.producer_host }}
      PLAN_TOOLING_SHA: ${{ needs.plan.outputs.tooling_sha }}
      PLAN_TAG: ${{ needs.plan.outputs.tag }}
    outputs:
      digests: ${{ steps.publish.outputs.digests }}
    steps:
      - name: Check out the trusted scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out yurt-packages (Pages branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: site
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check the artifact ids
        id: ids
        env:
          DIST_ID: ${{ needs.emit.outputs.dist_artifact_id }}
          COMPONENTS_ID: ${{ needs.emit.outputs.components_artifact_id }}
        run: |
          [[ "$DIST_ID" =~ ^[0-9]+$ && "$COMPONENTS_ID" =~ ^[0-9]+$ ]] || { echo "an artifact id from emit is not all digits" >&2; exit 1; }
          printf 'dist_artifact_id=%s\ncomponents_artifact_id=%s\n' "$DIST_ID" "$COMPONENTS_ID" >> "$GITHUB_OUTPUT"

      - name: Download the dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.ids.outputs.dist_artifact_id }}
          path: ${{ runner.temp }}/dist-artifact

      - name: Download the components
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.ids.outputs.components_artifact_id }}
          path: ${{ runner.temp }}/components-artifact

      - name: Validate the artifacts and create the release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIST_DIR: ${{ runner.temp }}/dist-artifact
          COMPONENTS_DIR: ${{ runner.temp }}/components-artifact
          YURT_SITE_DIR: ${{ github.workspace }}/site
        run: OUTPUT_FILE="$GITHUB_OUTPUT" "$GITHUB_WORKSPACE/trusted/tools/publish_rustup_dist.sh" publish

  check:
    needs: [plan, emit, publish]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read  # the trusted/ checkout
    env:
      PLAN_RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      PLAN_VERSION: ${{ needs.plan.outputs.version }}
      PLAN_REVISION: ${{ needs.plan.outputs.revision }}
      PLAN_DATE: ${{ needs.plan.outputs.date }}
      PLAN_PRODUCER_HOST: ${{ needs.plan.outputs.producer_host }}
      PLAN_TOOLING_SHA: ${{ needs.plan.outputs.tooling_sha }}
      PLAN_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Check out the trusted scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out yurt-rust tooling at the planned SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: YurtOS/yurt-rust
          ref: ${{ needs.plan.outputs.tooling_sha }}
          path: tooling
          token: ${{ secrets.YURT_RUST_READ_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check the artifact id
        id: ids
        env:
          DIST_ID: ${{ needs.emit.outputs.dist_artifact_id }}
        run: |
          [[ "$DIST_ID" =~ ^[0-9]+$ ]] || { echo "the dist artifact id from emit is not all digits" >&2; exit 1; }
          printf 'dist_artifact_id=%s\n' "$DIST_ID" >> "$GITHUB_OUTPUT"

      - name: Download the dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.ids.outputs.dist_artifact_id }}
          path: ${{ runner.temp }}/dist-artifact

      # dist.tar comes from emit, which ran tooling code: the trusted validator checks it and writes
      # only the five expected files, before any tooling code runs in this job.
      - name: Extract the dist through the validator
        env:
          DIST_DIR: ${{ runner.temp }}/dist-artifact
          DIST_OUT: ${{ runner.temp }}/dist-checked
        run: |
          python3 -I "$GITHUB_WORKSPACE/trusted/tools/rustup_dist_stage.py" extract --dir "$DIST_DIR" --out "$DIST_OUT"

      # Tooling code, read-only token, nothing uploaded: its only effect is its exit status.
      - name: Check every manifest URL against its sha256
        env:
          DIST_OUT: ${{ runner.temp }}/dist-checked
        run: |
          python3 "$GITHUB_WORKSPACE/tooling/scripts/verify_rustup_dist_urls.py" --dist "$DIST_OUT/dist" --channel "$PLAN_VERSION" --date "$PLAN_DATE"

  push:
    needs: [plan, emit, publish, check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that can read RUSTUP_DIST_PUBLISH_TOKEN (deployment branches: main only).
    environment: rustup-publish
    permissions:
      contents: read
    env:
      PLAN_RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
      PLAN_VERSION: ${{ needs.plan.outputs.version }}
      PLAN_REVISION: ${{ needs.plan.outputs.revision }}
      PLAN_DATE: ${{ needs.plan.outputs.date }}
      PLAN_PRODUCER_HOST: ${{ needs.plan.outputs.producer_host }}
      PLAN_TOOLING_SHA: ${{ needs.plan.outputs.tooling_sha }}
      PLAN_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Check out the trusted scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out yurt-packages (Pages branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: site
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check the artifact id
        id: ids
        env:
          DIST_ID: ${{ needs.emit.outputs.dist_artifact_id }}
        run: |
          [[ "$DIST_ID" =~ ^[0-9]+$ ]] || { echo "the dist artifact id from emit is not all digits" >&2; exit 1; }
          printf 'dist_artifact_id=%s\n' "$DIST_ID" >> "$GITHUB_OUTPUT"

      - name: Download the dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.ids.outputs.dist_artifact_id }}
          path: ${{ runner.temp }}/dist-artifact

      - name: Commit and push the manifests
        env:
          DIST_DIR: ${{ runner.temp }}/dist-artifact
          DIGESTS: ${{ needs.publish.outputs.digests }}
          YURT_SITE_DIR: ${{ github.workspace }}/site
          PUSH_TOKEN: ${{ secrets.RUSTUP_DIST_PUBLISH_TOKEN }}
        run: |
          "$GITHUB_WORKSPACE/trusted/tools/publish_rustup_dist.sh" push
