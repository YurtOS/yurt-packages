name: Publish Rustup Dist

on:
  workflow_dispatch:
    inputs:
      rust_release:
        description: "yurt-rust release tag to publish (rust-vX.Y.Z-A.B.C)"
        required: true
        type: string
      tooling_ref:
        description: "yurt-rust ref holding the emitter and checker (independent of the release tag)"
        required: false
        default: main
        type: string
      date:
        description: "Dist date YYYY-MM-DD (empty: today, UTC)"
        required: false
        default: ""
        type: string
      producer_host:
        description: "Host whose archive supplies the guest std"
        required: false
        default: x86_64-unknown-linux-gnu
        type: choice
        options:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin

# PACKAGE_PUBLISH_TOKEN needs read on private YurtOS/yurt-rust (contents and
# releases: tooling checkout, `gh release download`) and write on
# YurtOS/yurt-packages (contents and releases). See the README. Its push to main
# is also what triggers pages.yml; a GITHUB_TOKEN push would not.
permissions:
  contents: read  # every write goes through PACKAGE_PUBLISH_TOKEN

# Shares the group of publish-package.yml: both push to main and must not race.
concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out yurt-packages (Pages branch)
        uses: actions/checkout@v7
        with:
          ref: main
          path: site
          token: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
          persist-credentials: false

      - name: Check out yurt-rust tooling
        uses: actions/checkout@v7
        with:
          repository: YurtOS/yurt-rust
          ref: ${{ inputs.tooling_ref }}
          path: tooling
          token: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install ripgrep (needed by the emitter)
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Publish rustup dist
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
          RUST_RELEASE: ${{ inputs.rust_release }}
          TOOLING_REF: ${{ inputs.tooling_ref }}
          PUBLISH_DATE: ${{ inputs.date }}
          PRODUCER_HOST: ${{ inputs.producer_host }}
          YURT_RUST_TOOLING_DIR: ${{ github.workspace }}/tooling
          YURT_SITE_DIR: ${{ github.workspace }}/site
          PAGES_BRANCH: main
          WORK_DIR: ${{ runner.temp }}/rustup-dist
        run: site/tools/publish_rustup_dist.sh
