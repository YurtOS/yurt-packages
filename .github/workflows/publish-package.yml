name: Publish Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package port to build and publish"
        required: true
        type: choice
        options:
          - yurt-greet
          - pkg
          - busybox
          - ncurses
          - zsh
          - clang
          - ca-certificates
          - git
          - openssl
          - curl
          - jq
          - sqlite
          - gettext
          - xz
          - rtk
          - gh
          - go
          - python
          - numpy
          - pyzmq
          - jupyter-kernel
          - python-seal
          - node
          - gemini-cli
          - perl
          - make
          - zstd
          - pkgconf
          - zlib
      ports_sha:
        description: "yurt-ports commit to build from (full 40-hex SHA, in yurt-ports main's history); empty: main's head. The Python set (python, numpy, pyzmq, jupyter-kernel, python-seal) is published from one commit: pass the same one to all five."
        required: false
        type: string
        default: ""

permissions:
  contents: write

# Every run commits the package index to main. One run at a time, so a
# second dispatch starts from the first one's commit instead of racing its
# push. (A group holds one pending run: a third dispatch while one waits
# replaces the waiting one.)
concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A hang fails here, not at GitHub's 6-hour default. 45 minutes: the
    # slowest of the first 39 runs took 19.9. clang builds LLVM twice
    # (clang+lld, no compiler cache): the same build in yurt-clang's release
    # took 163 to 245 minutes on hosted runners, so it gets the 6-hour ceiling.
    timeout-minutes: ${{ inputs.package == 'clang' && 360 || 45 }}
    env:
      # dtolnay/rust-toolchain exports CARGO_TERM_COLOR=always when it is
      # unset. The guest SDK's cargo-yurt parses `cargo tree` output, and
      # colored output makes it fail ("cannot map tracked guest cargo tree
      # line") for every port with registry-ported crates, rtk among them.
      CARGO_TERM_COLOR: never
    steps:
      # Only main publishes: the commit step pushes to main, and Release
      # signs only what a Publish Package run on main committed. A dispatch
      # from another branch would put that branch's commits on main.
      - name: Runs on main only
        env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = refs/heads/main ] ||
            { echo "::error::Publish Package runs from main only (this run is on $REF)"; exit 1; }

      - name: Check out yurt-packages
        uses: actions/checkout@v7
        with:
          path: yurt-packages
          token: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
          # Read once here: no build step finds the token in a clone's
          # git config (the commit step pushes with it explicitly).
          persist-credentials: false

      - name: The yurt-ports commit is well-formed
        env:
          PORTS_SHA: ${{ inputs.ports_sha }}
        run: |
          set -euo pipefail
          [[ -z "$PORTS_SHA" || "$PORTS_SHA" =~ ^[0-9a-f]{40}$ ]] ||
            { echo "::error::ports_sha must be empty or a full 40-hex commit SHA"; exit 1; }

      - name: Check out yurt-ports
        uses: actions/checkout@v7
        with:
          repository: YurtOS/yurt-ports
          path: yurt-ports
          ref: ${{ inputs.ports_sha }}
          # main's history, for the check below.
          fetch-depth: 0
          token: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
          # Read once here: no build step finds the token in a clone's
          # git config (the commit step pushes with it explicitly).
          persist-credentials: false

      # Only what yurt-ports main has had: a commit off main (a pull
      # request's branch, say) is never published.
      - name: The yurt-ports commit is on main
        working-directory: yurt-ports
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main ||
            { echo "::error::yurt-ports $(git rev-parse HEAD) is not in main's history"; exit 1; }
          echo "building yurt-ports $(git rev-parse HEAD)"

      - name: Check out yurt-pkg
        uses: actions/checkout@v7
        with:
          repository: YurtOS/yurt-pkg
          path: yurt-pkg
          token: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
          # Read once here: no build step finds the token in a clone's
          # git config (the commit step pushes with it explicitly).
          persist-credentials: false

      - name: Check out yurt-go
        if: inputs.package == 'gh' || inputs.package == 'go'
        uses: actions/checkout@v7
        with:
          repository: YurtOS/yurt-go
          path: sources/yurt-go
          # The port pins a yurt-go commit and exports it with git archive.
          fetch-depth: 0
          token: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
          # Read once here; don't leave the token in the clone the build reads.
          persist-credentials: false

      - name: Set up bootstrap Go
        if: inputs.package == 'gh' || inputs.package == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: false

      - name: Check out yurt-clang
        if: inputs.package == 'clang'
        uses: actions/checkout@v7
        with:
          repository: YurtOS/yurt-clang
          path: sources/yurt-clang
          token: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
          # Read once here: no build step finds the token in a clone's
          # git config (the commit step pushes with it explicitly).
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-wasip1,wasm32-wasip1-threads
          components: rust-src

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Reject duplicate package version
        env:
          PORT: ${{ inputs.package }}
        run: |
          set -euxo pipefail
          cargo run --manifest-path yurt-pkg/Cargo.toml -p yurt-repo-ci -- \
            assert-not-published \
            --repo-root yurt-packages \
            --manifest "yurt-ports/ports/${PORT}/yurt-pack.toml"

      - name: Check out yurtos-kernel
        uses: actions/checkout@v7
        with:
          repository: YurtOS/yurtos-kernel
          path: yurtos-kernel
          token: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
          # Read once here: no build step finds the token in a clone's
          # git config (the commit step pushes with it explicitly).
          persist-credentials: false

      - name: Check out yurt-greet source
        if: inputs.package == 'yurt-greet'
        uses: actions/checkout@v7
        with:
          repository: YurtOS/yurt-greet
          path: sources/yurt-greet
          token: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
          # Read once here: no build step finds the token in a clone's
          # git config (the commit step pushes with it explicitly).
          persist-credentials: false

      - name: Install Binaryen
        run: |
          set -euxo pipefail
          BINARYEN_VER=119
          curl -sSL -o /tmp/binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VER}/binaryen-version_${BINARYEN_VER}-x86_64-linux.tar.gz"
          mkdir -p "$HOME/.binaryen"
          tar -xzf /tmp/binaryen.tar.gz -C "$HOME/.binaryen" --strip-components=1
          echo "$HOME/.binaryen/bin" >> "$GITHUB_PATH"

      - name: Install WASI SDK
        run: |
          set -euxo pipefail
          WASI_SDK_VER=33.0
          curl -sSL -o /tmp/wasi-sdk.tar.gz \
            "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VER%%.*}/wasi-sdk-${WASI_SDK_VER}-x86_64-linux.tar.gz"
          mkdir -p "$HOME/.local/share"
          tar -xzf /tmp/wasi-sdk.tar.gz -C "$HOME/.local/share"
          mv "$HOME/.local/share"/wasi-sdk-${WASI_SDK_VER}* "$HOME/.local/share/wasi-sdk"
          echo "WASI_SDK_PATH=$HOME/.local/share/wasi-sdk" >> "$GITHUB_ENV"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The cpython chain (python, numpy, pyzmq) cross-builds with a host
      # python of the target's minor version (cython, meson), as yurt-ports'
      # release-playground-image.yml does.
      - name: Set up the host Python the cpython chain builds with
        id: host-python
        if: >-
          inputs.package == 'python' || inputs.package == 'numpy' ||
          inputs.package == 'pyzmq' || inputs.package == 'python-seal'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Yurt guest SDK
        working-directory: yurtos-kernel
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
        run: |
          set -euxo pipefail
          scripts/install-yurt-sdk-release.sh
          scripts/publish-yurt-sdk-github-env.sh "$PWD/target/yurt-sdk"

      - name: Build Yurt Rust std
        if: inputs.package == 'yurt-greet'
        working-directory: yurtos-kernel
        run: scripts/build-rust-std.sh --rust "$(rustc --version | awk '{print $2}')"

      - name: Build dependency stages
        if: >-
          inputs.package == 'curl' || inputs.package == 'git' ||
          inputs.package == 'python' || inputs.package == 'numpy' ||
          inputs.package == 'pyzmq' || inputs.package == 'python-seal' ||
          inputs.package == 'perl'
        env:
          YURT_KERNEL_ROOT: ${{ github.workspace }}/yurtos-kernel
          PACKAGE: ${{ inputs.package }}
          HOST_PYTHON: ${{ steps.host-python.outputs.python-path }}
          # Every step builds from source here; nothing is read from or
          # stored in a port cache.
          YURT_PORT_CACHE: "off"
        run: |
          set -euxo pipefail
          # curl and git link these ports' staged static libraries; git's
          # curl stage itself needs the zlib and OpenSSL stages. The cpython
          # chain is yurt-ports' scripts/build-playground-image.sh order:
          # numpy and pyzmq compile against cpython-base (the interpreter
          # without them), and the cpython step links their extensions into
          # the interpreter the python package (ports/python) is composed
          # from. perl links zlib and bzip2.
          chain="zlib bzip2 xz openssl libzmq sqlite cpython-base"
          case "$PACKAGE" in
            curl) ports="zlib openssl" ;;
            git) ports="zlib openssl curl" ;;
            numpy) ports="$chain numpy" ;;
            pyzmq) ports="$chain pyzmq" ;;
            python) ports="$chain pyzmq numpy cpython" ;;
            # The sealable interpreter: C-only, so the chain without
            # cpython-base; its build checks the kernel would admit it.
            python-seal) ports="zlib bzip2 xz openssl libzmq sqlite cpython-seal" ;;
            perl) ports="zlib bzip2" ;;
          esac
          # yurt-ports' port-cache.sh names each step (cpython-base is the
          # cpython port built in build/base) and runs it with the env the
          # chain expects: numpy and pyzmq build here, against cpython-base,
          # and the package step only packs their stages.
          YURT_PORT_CACHE_RUN="$(yurt-ports/scripts/port-cache.sh begin)"
          export YURT_PORT_CACHE_RUN
          for step in $ports; do
            yurt-ports/scripts/port-cache.sh build "$step"
          done

      - name: Build package artifact
        env:
          YURT_KERNEL_ROOT: ${{ github.workspace }}/yurtos-kernel
          YURT_ROOT: ${{ github.workspace }}/yurtos-kernel
          YURT_RUST_STD: ${{ github.workspace }}/yurtos-kernel/abi/build/rust-std/1.95.0
          YURT_PKG_ROOT: ${{ github.workspace }}/yurt-pkg
          YURT_GREET_SOURCE: ${{ github.workspace }}/sources/yurt-greet
          YURT_PKG_SOURCE: ${{ github.workspace }}/yurt-pkg
          YURT_CLANG_SOURCE: ${{ github.workspace }}/sources/yurt-clang
          YURT_GO_SOURCE: ${{ github.workspace }}/sources/yurt-go
          HOST_PYTHON: ${{ steps.host-python.outputs.python-path }}
          PORT: ${{ inputs.package }}
          # node's port fetches its pinned YurtOS/yurt-node release (private)
          # with gh: the one build that gets the token in its environment.
          GH_TOKEN: ${{ inputs.package == 'node' && secrets.PACKAGE_PUBLISH_TOKEN || '' }}
          # numpy and pyzmq were built by the dependency step (outside it,
          # their build would not find cpython-base); pack those stages.
          YURT_PACKAGE_SKIP_BUILD: ${{ (inputs.package == 'numpy' || inputs.package == 'pyzmq') && '1' || '0' }}
        run: |
          set -euxo pipefail
          "yurt-ports/ports/${PORT}/scripts/package.sh"

      - name: Publish package metadata
        env:
          PORT: ${{ inputs.package }}
        run: |
          set -euxo pipefail
          generated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          artifact="$(ls "yurt-ports/ports/${PORT}/build/dist/"*.yurtpkg)"
          cargo run --manifest-path yurt-pkg/Cargo.toml -p yurt-repo-ci -- \
            publish-local \
            --repo-root yurt-packages \
            --artifact "$artifact" \
            --manifest "yurt-ports/ports/${PORT}/yurt-pack.toml" \
            --generated-at "$generated_at" \
            --reject-existing

      # publish-local also rewrites index.json and writes placeholder
      # bundles ("local test fixture bundle"). Only the archive and its
      # package metadata are committed here. release.yml, which this run's
      # completion triggers, regenerates and signs index.json and signs the
      # new archive, so main never carries an unsigned index or a placeholder.
      - name: Commit repository update
        env:
          PACKAGE: ${{ inputs.package }}
          # The push credential, here only: the checkouts keep no token.
          PUSH_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
        working-directory: yurt-packages
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- artifacts packages ':(exclude)*.bundle'
          if git diff --cached --name-only | grep -E '\.bundle$|^index\.json$'; then
            echo "refusing to commit a bundle or index.json; release.yml writes those" >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No package repository changes to commit."
            exit 0
          fi
          git commit -m "chore: publish ${PACKAGE} package"
          set +x
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
