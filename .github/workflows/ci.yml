name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rustup-dist-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install PyYAML (static workflow test)
        run: python3 -m pip install pyyaml==6.0.2
      - name: shellcheck
        run: shellcheck tools/publish_rustup_dist.sh
      # Runs test_publish_workflow.py (static checks of the five-job workflow; fails without
      # PyYAML), test_publish_rustup_dist.py (phases) and test_rustup_dist_stage.py (validator).
      # The tooling smoke test in test_publish_workflow.py skips here: CI cannot read yurt-rust.
      - name: Publication script and workflow tests
        run: python3 -m unittest discover -s tests -v
