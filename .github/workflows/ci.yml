name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rustup-dist-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: shellcheck
        run: shellcheck tools/publish_rustup_dist.sh
      - name: Publication script tests
        run: python3 -m unittest discover -s tests -v
