# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
# This repo ships no cargo/npm manifests — only GitHub Actions workflows.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # The Rust toolchain version is a deliberate pin (tracks the repo's
      # MSRV); bumping it breaks CI. Manage it manually.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
